<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yolo Send Gift</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#F5C451}a:hover{color:#FFD97A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 70% at 50% 0%, #3B1D78 0%, #160C33 55%, #0D0820 100%); color: #F4F0FF; font-family: 'Plus Jakarta Sans', sans-serif; position: relative; overflow: hidden">

  <div style="position: absolute; inset: 0; background: rgba(5,2,15,0.55)" aria-hidden="true"></div>

  <div style="position: absolute; top: 150px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="width: 150px; height: 150px; border-radius: 75px; background: radial-gradient(circle, rgba(245,196,81,0.55), rgba(245,196,81,0) 70%); display: flex; align-items: center; justify-content: center">
      <svg width="96" height="96" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 24l12 10 12-20 12 20 12-10-6 28H14z" fill="#F5C451" stroke="#FFE9A8" stroke-width="2" stroke-linejoin="round"></path><rect x="14" y="52" width="36" height="5" rx="2" fill="#E0A82E"></rect><circle cx="32" cy="14" r="3" fill="#FFF3CC"></circle><circle cx="8" cy="24" r="3" fill="#FFF3CC"></circle><circle cx="56" cy="24" r="3" fill="#FFF3CC"></circle></svg>
    </div>
    <div style="padding: 8px 16px; border-radius: 16px; background: linear-gradient(90deg, rgba(245,196,81,0.35), rgba(245,196,81,0.08)); font-size: 14px; font-weight: 700; color: #FDE7A8">Zara sent Crown ×1 to Aria</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px; border-radius: 28px 28px 0 0; background: #150D2E; border-top: 1px solid rgba(245,196,81,0.25); box-shadow: 0 -20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; padding: 16px 16px 28px; box-sizing: border-box; gap: 14px">

    <div style="display: flex; align-items: center; gap: 8px">
      <div style="font-size: 12px; color: #A79BC7; font-weight: 600">Send to</div>
      <sc-for list="{{targets}}" as="t" hint-placeholder-count="4">
        <button aria-label="{{t.name}}" style="width: 36px; height: 36px; border-radius: 18px; border: 2px solid {{t.border}}; background: {{t.color}}; color: #FFFFFF; font: 800 13px 'Plus Jakarta Sans', sans-serif; padding: 0">{{t.initial}}</button>
      </sc-for>
      <button style="margin-left: auto; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #F4F0FF; font: 700 12px 'Plus Jakarta Sans', sans-serif">All on mic</button>
    </div>

    <nav style="display: flex; gap: 20px; border-bottom: 1px solid rgba(255,255,255,0.06)">
      <a href="#" style="color: #F4F0FF; text-decoration: none; font-size: 15px; font-weight: 800; border-bottom: 3px solid #F5C451; padding-bottom: 8px">Gifts</a>
      <a href="#" style="color: #A79BC7; text-decoration: none; font-size: 14px; font-weight: 600; padding-bottom: 8px">Lucky</a>
      <a href="#" style="color: #A79BC7; text-decoration: none; font-size: 14px; font-weight: 600; padding-bottom: 8px">VIP</a>
      <a href="#" style="color: #A79BC7; text-decoration: none; font-size: 14px; font-weight: 600; padding-bottom: 8px">Backpack</a>
    </nav>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; flex: 1">
      <sc-for list="{{gifts}}" as="g" hint-placeholder-count="8">
        <button style="border-radius: 16px; border: 1.5px solid {{g.border}}; background: {{g.bg}}; color: #F4F0FF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 0; font-family: 'Plus Jakarta Sans', sans-serif">
          <span style="width: 44px; height: 44px; border-radius: 22px; background: {{g.tint}}; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: {{g.ink}}">{{g.glyph}}</span>
          <span style="font-size: 12px; font-weight: 700">{{g.name}}</span>
          <span style="display: flex; align-items: center; gap: 3px; font-size: 11px; color: #F5C451; font-weight: 700"><svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F5C451"></circle></svg>{{g.price}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Profile.dc.html" style="display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; font-weight: 800; color: #F5C451">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#F5C451"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#B8860B" stroke-width="2"></circle></svg>12,480
        <span style="font-size: 12px; color: #C4B8E6; font-weight: 600">Recharge</span>
      </a>
      <div style="margin-left: auto; display: flex; align-items: center; height: 44px; border-radius: 22px; border: 1px solid rgba(245,196,81,0.4); overflow: hidden">
        <button style="height: 44px; padding: 0 14px; border: none; background: transparent; color: #F4F0FF; font: 700 14px 'Plus Jakarta Sans', sans-serif">×1</button>
        <button style="height: 44px; padding: 0 20px; border: none; background: linear-gradient(135deg,#FFD97A,#E0A82E); color: #1A1200; font: 800 15px 'Plus Jakarta Sans', sans-serif">Send</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const g = (name, price, glyph, tint, ink, sel) => ({ name, price, glyph, tint, ink, border: sel ? '#F5C451' : 'rgba(255,255,255,0.06)', bg: sel ? 'rgba(245,196,81,0.10)' : 'rgba(255,255,255,0.04)' });
    const t = (name, initial, color, sel) => ({ name, initial, color, border: sel ? '#F5C451' : 'transparent' });
    return {
      targets: [
        t('Aria', 'A', 'linear-gradient(135deg,#EC4899,#8B5CF6)', true),
        t('Zara', 'Z', 'linear-gradient(135deg,#F59E0B,#EA580C)', false),
        t('Kenji', 'K', 'linear-gradient(135deg,#0EA5E9,#6366F1)', false),
        t('Omar', 'O', 'linear-gradient(135deg,#6366F1,#A855F7)', false)
      ],
      gifts: [
        g('Rose', '1', 'R', 'rgba(244,63,94,0.2)', '#FDA4AF', false),
        g('Heart', '10', 'H', 'rgba(236,72,153,0.2)', '#F9A8D4', false),
        g('Crown', '520', 'C', 'rgba(245,196,81,0.25)', '#FDE7A8', true),
        g('Diamond', '999', 'D', 'rgba(56,189,248,0.2)', '#7DD3FC', false),
        g('Rocket', '1,999', 'R', 'rgba(168,85,247,0.2)', '#D8B4FE', false),
        g('Sports Car', '5,200', 'S', 'rgba(239,68,68,0.2)', '#FCA5A5', false),
        g('Ring', '9,999', 'R', 'rgba(250,204,21,0.2)', '#FDE68A', false),
        g('Castle', '29,999', 'C', 'rgba(99,102,241,0.25)', '#C7D2FE', false)
      ]
    };
  }
}
</script>
</body>
</html>
