<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yolo Voice Room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#F5C451}a:hover{color:#FFD97A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 70% at 50% 0%, #3B1D78 0%, #160C33 55%, #0D0820 100%); color: #F4F0FF; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 10px; padding: 54px 16px 10px">
    <a href="Main.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.08); color: #F4F0FF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg,#7C3AED,#DB2777); display: flex; align-items: center; justify-content: center; font-weight: 800">L</div>
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
      <div style="font-size: 15px; font-weight: 800">Late Night Talks</div>
      <div style="font-size: 11px; color: #C4B8E6">ID 884216 · 128 online</div>
    </div>
    <button style="height: 32px; padding: 0 14px; border-radius: 16px; border: none; background: #F5C451; color: #1A1200; font: 800 12px 'Plus Jakarta Sans', sans-serif">Follow</button>
    <button aria-label="More" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: rgba(255,255,255,0.08); color: #F4F0FF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
    </button>
  </header>

  <div style="margin: 2px 16px 0; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,0.06); font-size: 12px; color: #D9D0F2">Welcome! Be kind, have fun. Mic requests are open.</div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 8px">
    <div style="width: 84px; height: 84px; border-radius: 42px; padding: 4px; background: conic-gradient(#F5C451, #FFE9A8, #E0A82E, #F5C451); box-shadow: 0 0 0 6px rgba(245,196,81,0.18), 0 0 30px rgba(245,196,81,0.55)">
      <div style="width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg,#EC4899,#8B5CF6); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; border: 3px solid #1A0F38; box-sizing: border-box">A</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700">Aria <span style="font-size: 10px; font-weight: 800; color: #1A1200; background: #F5C451; padding: 1px 6px; border-radius: 6px">HOST</span></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 6px; padding: 6px 14px 10px">
    <sc-for list="{{seats}}" as="s" hint-placeholder-count="8">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <sc-if value="{{s.taken}}" hint-placeholder-val="{{ true }}">
          <div style="width: 60px; height: 60px; border-radius: 30px; padding: 3px; box-sizing: border-box; background: {{s.ring}}; box-shadow: {{s.glow}}">
            <div style="width: 100%; height: 100%; border-radius: 50%; background: {{s.color}}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; border: 2px solid #1A0F38; box-sizing: border-box">{{s.initial}}</div>
          </div>
          <div style="font-size: 11px; font-weight: 600; max-width: 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</div>
        </sc-if>
        <sc-if value="{{s.empty}}" hint-placeholder-val="{{ false }}">
          <button aria-label="Take seat" style="width: 60px; height: 60px; border-radius: 30px; border: 1.5px dashed rgba(196,184,230,0.45); background: rgba(255,255,255,0.05); color: #C4B8E6; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
          <div style="font-size: 11px; color: #A79BC7">{{s.label}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 6px 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
    <div style="align-self: flex-start; padding: 7px 12px; border-radius: 14px; background: linear-gradient(90deg, rgba(245,196,81,0.28), rgba(245,196,81,0.06)); font-size: 12px; font-weight: 600; color: #FDE7A8">Zara sent a Crown to Aria ×1</div>
    <sc-for list="{{chat}}" as="m" hint-placeholder-count="4">
      <div style="align-self: flex-start; max-width: 300px; padding: 8px 12px; border-radius: 14px; background: rgba(13,8,32,0.55); font-size: 13px; line-height: 1.4">
        <span style="font-weight: 700; color: {{m.color}}">{{m.name}}: </span>{{m.text}}
      </div>
    </sc-for>
    <div style="align-self: flex-start; font-size: 12px; color: #A79BC7">Leo joined the room</div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px 30px">
    <label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Message</span>
      <input placeholder="Say hi..." style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.08); color: #F4F0FF; padding: 0 16px; font: 500 14px 'Plus Jakarta Sans', sans-serif; outline: none; min-width: 0">
    </label>
    <button aria-label="Microphone" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.10); color: #F4F0FF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0014 0M12 18v3"></path></svg>
    </button>
    <button aria-label="Games" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.10); color: #F4F0FF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="7" width="20" height="12" rx="6"></rect><path d="M7 11v4M5 13h4"></path></svg>
    </button>
    <a href="Gifts.dc.html" aria-label="Send gift" style="width: 48px; height: 48px; border-radius: 24px; background: linear-gradient(135deg,#FFD97A,#E0A82E); color: #1A1200; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(245,196,81,0.45)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"></rect><path d="M3 13h18M12 9v12M12 9c-2-4-6-4-6-1s6 1 6 1c2-4 6-4 6-1s-6 1-6 1"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const speak = 'conic-gradient(#F5C451,#FFE9A8,#E0A82E,#F5C451)';
    const idle = 'rgba(255,255,255,0.14)';
    const seat = (name, initial, color, speaking) => ({ taken: true, empty: false, name, initial, color, ring: speaking ? speak : idle, glow: speaking ? '0 0 18px rgba(245,196,81,0.6)' : 'none' });
    const empty = (n) => ({ taken: false, empty: true, label: 'Seat ' + n });
    return {
      seats: [
        seat('Zara', 'Z', 'linear-gradient(135deg,#F59E0B,#EA580C)', true),
        seat('Kenji', 'K', 'linear-gradient(135deg,#0EA5E9,#6366F1)', false),
        seat('Mia', 'M', 'linear-gradient(135deg,#10B981,#0EA5E9)', false),
        empty(4),
        seat('Omar', 'O', 'linear-gradient(135deg,#6366F1,#A855F7)', true),
        empty(6), empty(7), empty(8)
      ],
      chat: [
        { name: 'Kenji', text: 'Good evening everyone!', color: '#7DD3FC' },
        { name: 'Mia', text: 'Who wants to play Ludo after this?', color: '#86EFAC' },
        { name: 'Omar', text: 'Count me in', color: '#C4B5FD' }
      ]
    };
  }
}
</script>
</body>
</html>
