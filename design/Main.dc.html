<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yolo Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#F5C451}a:hover{color:#FFD97A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0820; color: #F4F0FF; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="position: absolute; top: -120px; right: -80px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.35), rgba(139,92,246,0) 70%)" aria-hidden="true"></div>

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 12px; position: relative">
    <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: {{gold}}">Yolo</div>
    <div style="display: flex; align-items: center; gap: 10px">
      <button style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid rgba(245,196,81,0.35); background: rgba(245,196,81,0.10); color: #F5C451; font: 700 13px 'Plus Jakarta Sans', sans-serif">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#F5C451"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#B8860B" stroke-width="2"></circle></svg>
        12,480
      </button>
      <button aria-label="Search" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.06); color: #F4F0FF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </button>
      <button aria-label="Notifications" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.06); color: #F4F0FF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
      </button>
    </div>
  </header>

  <nav style="display: flex; gap: 22px; padding: 4px 20px 14px; position: relative">
    <a href="#" style="color: #F4F0FF; text-decoration: none; font-size: 17px; font-weight: 800; border-bottom: 3px solid #F5C451; padding-bottom: 6px">Popular</a>
    <a href="#" style="color: #A79BC7; text-decoration: none; font-size: 15px; font-weight: 600; padding-top: 2px">Following</a>
    <a href="#" style="color: #A79BC7; text-decoration: none; font-size: 15px; font-weight: 600; padding-top: 2px">New</a>
    <a href="#" style="color: #A79BC7; text-decoration: none; font-size: 15px; font-weight: 600; padding-top: 2px">Games</a>
  </nav>

  <div style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; position: relative">
    <div style="border-radius: 22px; padding: 18px; background: linear-gradient(135deg, #6D28D9, #A21CAF); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 12px 30px rgba(109,40,217,0.35)">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #FDE7A8">TONIGHT</div>
        <div style="font-size: 19px; font-weight: 800">Ludo Party Night</div>
        <div style="font-size: 13px; color: #F1E6FF">Play with your room and win coins</div>
      </div>
      <button style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #F5C451; color: #1A1200; font: 800 13px 'Plus Jakarta Sans', sans-serif">Join</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 18px; font-weight: 800">Hot rooms</div>
      <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">See all</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{rooms}}" as="room" hint-placeholder-count="4">
        <a href="Room.dc.html" style="text-decoration: none; color: #F4F0FF; border-radius: 20px; background: #1A1233; border: 1px solid rgba(255,255,255,0.06); overflow: hidden; display: flex; flex-direction: column">
          <div style="height: 112px; position: relative; background: {{room.cover}}; display: flex; align-items: center; justify-content: center">
            <div style="font-size: 34px; font-weight: 800; color: rgba(255,255,255,0.9)">{{room.initial}}</div>
            <div style="position: absolute; top: 8px; left: 8px; display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; background: rgba(13,8,32,0.6); font-size: 11px; font-weight: 700">
              <span style="width: 6px; height: 6px; border-radius: 3px; background: #4ADE80"></span>{{room.online}}
            </div>
          </div>
          <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
            <div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{room.name}}</div>
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="font-size: 12px; color: #A79BC7">{{room.host}}</span>
              <span style="font-size: 10px; font-weight: 700; color: #F5C451; padding: 2px 7px; border-radius: 8px; background: rgba(245,196,81,0.12)">{{room.tag}}</span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav style="height: 84px; padding: 0 18px 18px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; background: rgba(20,13,42,0.92); border-top: 1px solid rgba(255,255,255,0.06); position: relative">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #F5C451; text-decoration: none; font-size: 11px; font-weight: 700; width: 56px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"></path></svg>Home
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #A79BC7; text-decoration: none; font-size: 11px; font-weight: 600; width: 56px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="7" width="20" height="12" rx="6"></rect><path d="M7 11v4M5 13h4"></path><circle cx="16" cy="12" r="1"></circle><circle cx="18" cy="14" r="1"></circle></svg>Games
    </a>
    <a href="Room.dc.html" aria-label="Create room" style="width: 56px; height: 56px; margin-top: -26px; border-radius: 28px; background: linear-gradient(135deg, #FFD97A, #E0A82E); color: #1A1200; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(245,196,81,0.45)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #A79BC7; text-decoration: none; font-size: 11px; font-weight: 600; width: 56px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Messages
    </a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #A79BC7; text-decoration: none; font-size: 11px; font-weight: 600; width: 56px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Me
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"gold":{"editor":"color","default":"#F5C451","options":["#F5C451","#FFD97A","#E0A82E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      gold: this.props.gold ?? '#F5C451',
      rooms: [
        { name: 'Late Night Talks', host: 'Aria', tag: 'Chat', online: '128', initial: 'L', cover: 'linear-gradient(135deg,#7C3AED,#DB2777)' },
        { name: 'Sing With Me', host: 'Kenji', tag: 'Music', online: '96', initial: 'S', cover: 'linear-gradient(135deg,#0EA5E9,#6366F1)' },
        { name: 'Ludo Champions', host: 'Zara', tag: 'Games', online: '74', initial: 'L', cover: 'linear-gradient(135deg,#F59E0B,#EA580C)' },
        { name: 'Friends Lounge', host: 'Omar', tag: 'Friends', online: '61', initial: 'F', cover: 'linear-gradient(135deg,#10B981,#0EA5E9)' }
      ]
    };
  }
}
</script>
</body>
</html>
